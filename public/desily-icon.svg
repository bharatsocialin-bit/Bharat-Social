<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Desily logo">
  <!--
    Desily icon — stylized "D" formed by a navy arc and a saffron vertical bar,
    with a green accent dot. Indian-inspired geometric form (lotus-petal curve +
    chakra dot) without copying the national flag or national emblem.

    Brand palette:
      Saffron #FF9933  — primary accent (the bar)
      Green   #138808  — secondary accent (the dot)
      Navy    #0B2545  — primary structure (the arc / ring)
      Ivory   #FFFDF7  — background (transparent here for theming)
  -->
  <defs>
    <!-- Saffron→green petal gradient for the inner accent -->
    <linearGradient id="desily-petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <!-- Navy outer arc forming the curved back of the "D" -->
  <path
    d="M 8 6
       L 8 34
       L 14 34
       L 14 6
       Z
       M 14 6
       A 14 14 0 1 1 14 34
       L 14 28
       A 8 8 0 1 0 14 12
       Z"
    fill="#0B2545"
  />

  <!-- Saffron vertical bar (the straight stroke of the "D") -->
  <rect x="14" y="6" width="3.4" height="28" fill="#FF9933"/>

  <!-- Green accent dot inside the curve — a chakra-inspired punctuation -->
  <circle cx="26" cy="20" r="3.4" fill="url(#desily-petal)"/>
</svg>
