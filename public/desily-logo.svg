<?xml version="1.0" encoding="utf-8"?>
<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Desily — One India. Every Voice.">
  <!--
    Desily horizontal lockup: icon + "Desily" wordmark + "One India. Every Voice." tagline.
    Used in wide containers (desktop sidebar, homepage hero, email headers, OG image).

    Brand palette:
      Navy    #0B2545 — wordmark + icon structure
      Saffron #FF9933 — icon accent
      Green   #138808 — icon accent
  -->
  <defs>
    <linearGradient id="desily-petal-wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <!-- Icon (scaled to 200×200, top-left) -->
  <g transform="translate(20, 20) scale(4)">
    <path
      d="M 8 6
         L 8 34
         L 14 34
         L 14 6
         Z
         M 14 6
         A 14 14 0 1 1 14 34
         L 14 28
         A 8 8 0 1 0 14 12
         Z"
      fill="#0B2545"
    />
    <rect x="14" y="6" width="3.4" height="28" fill="#FF9933"/>
    <circle cx="26" cy="20" r="3.4" fill="url(#desily-petal-wide)"/>
  </g>

  <!-- Wordmark "Desily" — geometric sans-serif built from rounded rects + paths -->
  <g fill="#0B2545" font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <text x="220" y="120" font-size="84" letter-spacing="-2">Desily</text>
  </g>

  <!-- Tagline -->
  <text x="222" y="160" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#138808" letter-spacing="0.5">
    One India. Every Voice.
  </text>
</svg>
