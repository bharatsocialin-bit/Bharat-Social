<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Desily">
  <!--
    Desily favicon — simplified 32×32 version of the icon for browser tabs,
    app icons, and PWA install prompts. Solid navy background for max contrast
    at small sizes; saffron "D" stroke + green accent dot.
  -->
  <rect width="32" height="32" rx="7" fill="#0B2545"/>
  <!-- Saffron "D" — straight bar + curved arc, simplified for 32px -->
  <path
    d="M 9 7
       L 9 25
       L 13 25
       L 13 7
       Z
       M 13 7
       A 9 9 0 1 1 13 25
       L 13 21
       A 5 5 0 1 0 13 11
       Z"
    fill="#FF9933"
  />
  <circle cx="21" cy="16" r="2.6" fill="#138808"/>
</svg>
